services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: seatrush
      POSTGRES_PASSWORD: seatrush
      POSTGRES_DB: seatrush
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seatrush -d seatrush']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
